name: Import legacy character images

on:
  push:
    paths:
      - "imports/character_encyclopedia_legacy_import.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract legacy import
        run: |
          test -f imports/character_encyclopedia_legacy_import.zip
          unzip -o imports/character_encyclopedia_legacy_import.zip -d .
          rm imports/character_encyclopedia_legacy_import.zip

      - name: Commit extracted assets
        run: |
          git config user.name "character-encyclopedia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public imports
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Import legacy character images"
          git push
