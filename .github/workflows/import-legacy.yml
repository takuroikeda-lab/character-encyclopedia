name: Import character assets

on:
  push:
    paths:
      - "imports/character_encyclopedia_legacy_import.zip"
      - "imports/character_encyclopedia_regenerated_import.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract legacy import
        if: hashFiles('imports/character_encyclopedia_legacy_import.zip') != ''
        run: |
          unzip -o imports/character_encyclopedia_legacy_import.zip -d .
          rm imports/character_encyclopedia_legacy_import.zip

      - name: Extract regenerated import
        if: hashFiles('imports/character_encyclopedia_regenerated_import.zip') != ''
        run: |
          unzip -o imports/character_encyclopedia_regenerated_import.zip -d .
          rm imports/character_encyclopedia_regenerated_import.zip
          node scripts/apply-regenerated.mjs

      - name: Commit imported assets
        run: |
          git config user.name "character-encyclopedia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public imports
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Import regenerated character images"
          git push
