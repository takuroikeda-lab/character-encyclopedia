name: Import character
on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Staging directory, e.g. imports/038'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: character-import-main
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Validate staged character
        run: python3 scripts/import_character.py --stage "${{ inputs.stage }}" --check-only
      - name: Prepare atomic update
        run: python3 scripts/import_character.py --stage "${{ inputs.stage }}"
      - name: Commit all changes together
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/characters.json public/numbering-audit.json public/characters/
          ID=$(python3 -c "import json;print(json.load(open('${{ inputs.stage }}/metadata.json'))['id'])")
          NAME=$(python3 -c "import json;print(json.load(open('${{ inputs.stage }}/metadata.json'))['nameEn'])")
          git commit -m "Add character #$(printf '%03d' "$ID") $NAME"
          git push origin HEAD:main
